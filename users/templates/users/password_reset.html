{% extends 'users/base.html' %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block content %}

<div class="desk-head auth-card">
    <div>
        <p class="page-eyebrow">Account recovery</p>
        <h1 class="page-title">Reset password</h1>
    </div>
</div>

<form method="post" class="fields slab slab-pad auth-card" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="field">
        <label for="id_email">Email</label>
        <input type="email" name="email" id="id_email" autocomplete="email" placeholder="Email" required value="{{ user.email }}">
    </div>

    <div class="form-actions">
        {% if user %}
        <a class="btn btn--ghost" href="{% url 'profile' %}">Cancel</a>
        {% else %}
        <a class="btn btn--ghost" href="{% url 'login' %}">Cancel</a>
        {% endif %}
        <button type="submit" class="btn btn--primary btn--spacer">
            <i class="fa fa-envelope"></i> Send email
        </button>
    </div>
</form>

{% endblock %}
