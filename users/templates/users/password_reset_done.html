{% extends 'users/base.html' %}

{% block content %}

<div class="desk-head auth-card">
    <div>
        <h1 class="page-title">Check your email</h1>
    </div>
</div>

<section class="fields slab slab-pad auth-card">
    <p>If an eligible account matches that email, we've sent a password reset link. Check your spam folder too.</p>
    <div class="form-actions">
        <a class="btn btn--primary" href="{% url 'login' %}">Back to log in</a>
    </div>
</section>

{% endblock %}
