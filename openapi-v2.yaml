openapi: 3.0.3
info:
  title: Autumn API v2
  version: 2.0.0
paths:
  /api/v2/commitments/:
    get:
      operationId: commitments_list
      parameters:
      - in: query
        name: applies_to
        schema:
          type: string
          pattern: ^(project|subproject|context|tag):[1-9][0-9]*$
          minLength: 1
        description: Return commitments relevant to one owned resource, formatted
          as project:<id>, subproject:<id>, context:<id>, or tag:<id>.
      - in: query
        name: include
        schema:
          enum:
          - streak
          type: string
          minLength: 1
        description: '* `streak` - streak'
      tags:
      - commitments
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentListResponse'
          description: ''
      x-autumn-mcp: include
    post:
      operationId: commitments_create
      tags:
      - commitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommitmentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommitmentCreateRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentResource'
          description: ''
      x-autumn-mcp: include
  /api/v2/commitments/{commitment_id}:
    get:
      operationId: commitments_retrieve
      parameters:
      - in: path
        name: commitment_id
        schema:
          type: integer
        required: true
      tags:
      - commitments
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentResource'
          description: ''
      x-autumn-mcp: include
    patch:
      operationId: commitments_partial_update
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        description: Optional current integer commitment version.
      - in: path
        name: commitment_id
        schema:
          type: integer
        required: true
      tags:
      - commitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommitmentChangesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommitmentChangesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommitmentChangesRequest'
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentResource'
          description: ''
      x-autumn-mcp: include
    delete:
      operationId: commitments_destroy
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        description: Optional current integer commitment version.
      - in: path
        name: commitment_id
        schema:
          type: integer
        required: true
      tags:
      - commitments
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Commitment deleted.
      x-autumn-mcp: include
  /api/v2/commitments/{commitment_id}/adjustments/:
    post:
      operationId: commitments_adjustments_create
      parameters:
      - in: path
        name: commitment_id
        schema:
          type: integer
        required: true
      tags:
      - commitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentAdjustmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommitmentAdjustmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommitmentAdjustmentRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentAdjustmentResponse'
          description: ''
      x-autumn-mcp: include
  /api/v2/commitments/{commitment_id}/periods/:
    get:
      operationId: commitments_periods_list
      parameters:
      - in: path
        name: commitment_id
        schema:
          type: integer
        required: true
      - in: query
        name: generation
        schema:
          type: integer
          minimum: 1
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      tags:
      - commitments
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentPeriodListResponse'
          description: ''
      x-autumn-mcp: include
  /api/v2/commitments/{commitment_id}/restart/:
    post:
      operationId: commitments_restart
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        description: Optional current integer commitment version.
      - in: path
        name: commitment_id
        schema:
          type: integer
        required: true
      tags:
      - commitments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentRestartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CommitmentRestartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommitmentRestartRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentResource'
          description: ''
      x-autumn-mcp: include
  /api/v2/contexts/:
    get:
      operationId: contexts_list
      tags:
      - contexts
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextListResponse'
          description: ''
      x-autumn-mcp: include
    post:
      operationId: contexts_create
      tags:
      - contexts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContextWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContextWriteRequest'
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResource'
          description: ''
      x-autumn-mcp: include
  /api/v2/contexts/{context_id}:
    patch:
      operationId: contexts_partial_update
      parameters:
      - in: path
        name: context_id
        schema:
          type: integer
        required: true
      tags:
      - contexts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContextWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedContextWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedContextWriteRequest'
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResource'
          description: ''
      x-autumn-mcp: include
    delete:
      operationId: contexts_destroy
      parameters:
      - in: path
        name: context_id
        schema:
          type: integer
        required: true
      tags:
      - contexts
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Context deleted.
      x-autumn-mcp: include
  /api/v2/dashboard/:
    get:
      operationId: dashboard_retrieve
      parameters:
      - in: query
        name: context
        schema:
          type: string
        description: Context ID or 'all'; defaults to all contexts.
      tags:
      - dashboard
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
          description: ''
      x-autumn-mcp: include
  /api/v2/export/:
    get:
      operationId: export_retrieve
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: autumn_compatible
        schema:
          type: boolean
          default: false
      - in: query
        name: compress
        schema:
          type: boolean
          default: false
      - in: query
        name: context_ids
        schema:
          type: string
          minLength: 1
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: exclude_project_ids
        schema:
          type: string
          minLength: 1
      - in: query
        name: exclude_subproject_ids
        schema:
          type: string
          minLength: 1
      - in: query
        name: exclude_tag_ids
        schema:
          type: string
          minLength: 1
      - in: query
        name: export_format
        schema:
          enum:
          - '1'
          - '2'
          type: string
          default: '2'
          minLength: 1
        description: |-
          * `1` - 1
          * `2` - 2
      - in: query
        name: note_snippet
        schema:
          type: string
          minLength: 1
      - in: query
        name: project_ids
        schema:
          type: string
          minLength: 1
      - in: query
        name: project_name
        schema:
          type: string
      - in: query
        name: related
        schema:
          type: boolean
        description: With search, also include completed sessions that match it by
          meaning. Needs AI features and an OpenAI key on the account; otherwise ignored.
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Search project names, assigned subproject names and session notes.
          Every word must appear (in any of them, in any order); put a phrase in double
          quotes to match it as written. Common words such as "it" and "the" are ignored.
      - in: query
        name: similarity
        schema:
          type: number
          format: double
          maximum: 0.6
          minimum: 0.25
        description: How close a meaning-based match must be to count as related,
          from 0.25 (loose) to 0.60 (strict). Defaults to the account's setting (0.45
          unless changed in Profile). Only used with search and related=true; the
          cutoff applied is echoed in the X-Autumn-Related-Similarity header.
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: subproject_ids
        schema:
          type: string
          minLength: 1
      - in: query
        name: tag_ids
        schema:
          type: string
          minLength: 1
      tags:
      - export
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format2Document'
          description: ''
      x-autumn-mcp: include
  /api/v2/import/:
    post:
      operationId: import_create
      tags:
      - import
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSummary'
          description: ''
      x-autumn-mcp: include
  /api/v2/import/uploads/:
    post:
      operationId: import_uploads_create
      tags:
      - import
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportUploadResponse'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/import/uploads/{upload_id}/stream/:
    get:
      operationId: import_uploads_stream_retrieve
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - event-stream
          - json
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - import
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: Server-sent default message events. Each data payload is a
            JSON object with a message string containing an import progress, completion,
            skipped-project, or Error line from iter_import.
      x-autumn-mcp: exclude
  /api/v2/insights/chats/:
    get:
      operationId: insights_chats_list
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      tags:
      - insights
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightChatList'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/insights/chats/{chat_id}:
    get:
      operationId: insights_chats_retrieve
      parameters:
      - in: path
        name: chat_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - insights
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightChatDetail'
          description: ''
      x-autumn-mcp: exclude
    delete:
      operationId: insights_chats_destroy
      parameters:
      - in: path
        name: chat_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - insights
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: Chat deleted.
      x-autumn-mcp: exclude
  /api/v2/insights/options/:
    get:
      operationId: insights_options_retrieve
      tags:
      - insights
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightOptions'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/insights/selection/:
    get:
      operationId: insights_selection_retrieve
      parameters:
      - in: query
        name: chat_id
        schema:
          type: string
          format: uuid
      - in: query
        name: context
        schema:
          oneOf:
          - type: integer
            minimum: 1
          - type: string
            enum:
            - all
          nullable: true
        description: A context ID, or 'all' for all contexts.
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: exclude_projects
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: include_projects
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: note_snippet
        schema:
          type: string
      - in: query
        name: project_name
        schema:
          type: string
      - in: query
        name: related
        schema:
          type: boolean
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: similarity
        schema:
          type: number
          format: double
          maximum: 0.6
          minimum: 0.25
        description: How close a meaning-based match must be to count as related,
          from 0.25 (loose) to 0.60 (strict). Defaults to the account's setting (0.45
          unless changed in Profile). Only used with search and related=true; the
          cutoff applied is echoed in the X-Autumn-Related-Similarity header.
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: integer
      tags:
      - insights
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSelection'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/insights/stream/:
    post:
      operationId: insights_stream_create
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - event-stream
          - json
      tags:
      - insights
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightStreamRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InsightStreamRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InsightStreamRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: Server-sent events. Emits chat (chat identifiers/URLs), delta
            (content fragment), done (final content, rendered HTML, sources, usage
            and model), error, plus keep-alive comment lines.
      x-autumn-mcp: exclude
  /api/v2/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
      x-autumn-mcp: include
  /api/v2/me/account/:
    get:
      operationId: me_account_retrieve
      tags:
      - me
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
      x-autumn-mcp: exclude
    patch:
      operationId: me_account_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatch'
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/me/api-keys/{provider}:
    put:
      operationId: me_api_keys_update
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configured'
          description: ''
      x-autumn-mcp: exclude
    delete:
      operationId: me_api_keys_destroy
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - me
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configured'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/me/avatar/:
    put:
      operationId: me_avatar_update
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageUpload'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatus'
          description: ''
      x-autumn-mcp: exclude
    delete:
      operationId: me_avatar_destroy
      tags:
      - me
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatus'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/me/background/:
    put:
      operationId: me_background_update
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUpload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageUpload'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatus'
          description: ''
      x-autumn-mcp: exclude
    delete:
      operationId: me_background_destroy
      tags:
      - me
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatus'
          description: ''
      x-autumn-mcp: exclude
  /api/v2/me/background/download/:
    get:
      operationId: me_background_download_retrieve
      tags:
      - me
      security:
      - basicAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: Current automatic or uploaded background file download.
      x-autumn-mcp: exclude
  /api/v2/me/chatgpt-login/:
    get:
      operationId: me_chatgpt_login_retrieve
      tags:
      - me
      security:
